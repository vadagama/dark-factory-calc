assumptions:
  - id: A-1
    statement: >-
      The calculator behaves as an immediate-execution calculator: a pending
      binary operator plus a current operand exist, and "=" completes the
      pending operation.
    status: observed in the product problem statement ("current operand"); to be confirmed by Q1
  - id: A-2
    statement: >-
      The calculator already formats numbers according to its own rules, and
      "the same precision as the other operations" means those rules apply
      unchanged to percent results (verified differentially in REQ-003, so no
      absolute precision value is assumed).
    status: accepted
  - id: A-3
    statement: >-
      The existing layout has room for one additional key, so "%" can be added
      without removing or reordering a pre-existing key. If it does not, the
      layout question Q2 must be answered before implementation.
    status: open (Q2, non-blocking for the criteria as written)

open_questions:
  - id: Q1
    anchor: spec/requirements/REQ-002-percent-semantics.md#AC-1
    blocking: true
    text: >-
      Confirm the percent convention for + and -: percent-of-first-operand
      (200 + 10 % = 220) as specified, or literal b/100 (200 + 10 % = 200.1)?
  - id: Q2
    anchor: spec/requirements/REQ-001-percent-key.md#AC-2
    blocking: false
    text: >-
      Where does the "%" key go, given that no existing key may be removed,
      renamed or reordered: new key in the existing operator row, additional
      row/column slot, or an existing free slot?
  - id: Q3
    anchor: spec/requirements/REQ-004-edge-cases-and-errors.md#AC-3
    blocking: false
    text: >-
      Confirm that "%" pressed with a pending operator and no current operand
      treats the current operand as 0 (display unchanged, "=" shows 200).
